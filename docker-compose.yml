version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: fmr-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fmr_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend-go/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fmr-network

  # Go Backend (FIPS-Compliant)
  backend:
    build:
      context: ./backend-go
      dockerfile: Dockerfile
    container_name: fmr-backend-fips
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/fmr_db?sslmode=prefer
      PORT: 4000
      GODEBUG: fips140=on
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - fmr-network

  # Frontend (React + Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_CLIENT_TARGET: http://localhost:4000
    container_name: fmr-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - fmr-network

networks:
  fmr-network:
    driver: bridge

volumes:
  postgres_data:
